<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>NEKORA v4 — From Scratch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f5f7;font-family:Inter,sans-serif;min-height:100vh}
:root{--bg:#080a0f;--card:#12131a;--card2:#1a1c27;--line:#232532;--muted:#8b8ea1;--white:#fff}
#splash{position:fixed;inset:0;background:#080a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
.logo-box{width:64px;height:64px;background:#fff;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:32px;color:#000;position:relative;box-shadow:0 0 40px #ffffff18}
.logo-box::after{content:"";position:absolute;bottom:-5px;right:14px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:0 0 4px 0}
.splash-name{margin-top:16px;font-weight:900;letter-spacing:8px;font-size:26px}
.splash-sub{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:6px}
.header{max-width:1120px;margin:auto;padding:20px;display:flex;justify-content:space-between;align-items:center}
.header-left{display:flex;align-items:center;gap:12px}
.header-icon{width:38px;height:38px;background:#fff;border-radius:11px;display:grid;place-items:center;font-weight:900;color:#000;font-size:18px;position:relative}
.header-icon::after{content:"";position:absolute;bottom:-3px;right:7px;width:9px;height:9px;background:#fff;transform:rotate(45deg)}
.header h1{margin:0;font-size:20px;letter-spacing:4px;font-weight:900}
.header p{margin:0;color:var(--muted);font-size:10px;letter-spacing:2px}
.wrap{max-width:1120px;margin:auto;padding:0 20px 100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0c0d13;color:#fff;outline:none;margin:6px 0 12px}
input:focus{border-color:#fff}button{padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#000;font-weight:700;cursor:pointer}
button.secondary{background:var(--card2);color:#fff}button:disabled{opacity:.5}
label{font-size:13px;color:#d0d2dd;margin:10px 0 4px;display:block}
.muted{color:var(--muted);font-size:13px}.status{font-size:12px;color:var(--muted);min-height:18px;margin-top:8px}
.hidden{display:none!important}
#authPanel{max-width:420px;margin:40px auto}
.nav{position:fixed;bottom:10px;left:12px;right:12px;background:#12131ae6;backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;gap:6px;z-index:50}
.navitem{flex:1;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:12px;padding:10px;font-size:12px;font-weight:600}
