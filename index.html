<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0818">
  <title>Daftar MEXA SMART</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0818;
      --panel: #151027;
      --border: #302544;
      --text: #f6f3ff;
      --muted: #aaa4c2;
      --primary: #8b5cf6;
      --accent: #00e5ff;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #32175b66, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }

    .register-page {
      width: min(100%, 440px);
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 39px;
      font-weight: 950;
      letter-spacing: 3px;
    }

    .m, .a { color: var(--primary); }
    .x { color: var(--accent); }

    .e {
      display: inline-flex;
      flex-direction: column;
      justify-content: space-between;
      vertical-align: -3px;
      width: 20px;
      height: 26px;
      margin: 0 2px;
    }

    .e i {
      height: 4px;
      width: 100%;
      background: var(--primary);
      border-radius: 2px;
    }

    .brand p {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 3px;
      margin-top: 3px;
    }

    .card {
      padding: 28px;
      background: #151027ee;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 70px #0005;
    }

    .eyebrow {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      font-size: 11px;
    }

    h1 {
      font-size: 28px;
      margin: 9px 0;
    }

    .intro {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      display: block;
      width: 100%;
      min-height: 46px;
      padding: 12px;
      background: #0d0a17;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      border-color: var(--primary);
    }

    input::placeholder { color: #766d89; }

    .register-button {
      width: 100%;
      min-height: 47px;
      margin-top: 6px;
      border: 1px solid #a78bfa;
      border-radius: 10px;
      background: linear-gradient(110deg, #7c3aed, #8b5cf6);
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .register-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #0d0a17;
      border: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message.visible { display: block; }
    .message.error { color: var(--danger); }
    .message.info { color: var(--accent); }

    .login-note {
      text-align: center;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .login-note a {
      color: var(--accent);
      text-decoration: none;
    }

    .footnote {
      text-align: center;
      color: #766d89;
      font-size: 11px;
      margin-top: 22px;
      line-height: 1.7;
    }

    @media (max-width: 400px) {
      .card { padding: 22px 18px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <main class="register-page">
    <header class="brand">
      <div class="logo" aria-label="MEXA">
        <span class="m">M</span>
        <span class="e" aria-label="E">
          <i></i><i></i><i></i>
        </span>
        <span class="x">X</span><span class="a">A</span>
      </div>
      <p>SMART SOCIAL PLATFORM</p>
    </header>

    <section class="card">
      <div class="eyebrow">Gabung MEXA</div>
      <h1>Buat akun baru</h1>
      <p class="intro">
        Daftar untuk memulai akun MEXA SMART.
        Informasi akun akan diteruskan melalui jalur
        pendaftaran resmi MEXA.
      </p>

      <form id="mexaRegisterForm">
        <div class="field">
          <label for="displayName">Nama lengkap</label>
          <input
            id="displayName"
            name="displayName"
            type="text"
            autocomplete="name"
            maxlength="80"
            placeholder="Masukkan nama lengkap"
            required
          >
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            pattern="[A-Za-z0-9_.]+"
            placeholder="Contoh: arip_rahman"
            required
          >
        </div>

        <div class="field">
          <label for="email">Alamat email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            placeholder="nama@email.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Kata sandi</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            placeholder="Minimal 8 karakter"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Ulangi kata sandi</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            maxlength="72"
            placeholder="Masukkan ulang kata sandi"
            required
          >
        </div>

        <button
          class="register-button"
          id="registerButton"
          type="submit"
        >
          Daftar Sekarang
        </button>

        <div
          class="message"
          id="registerMessage"
          role="status"
          aria-live="polite"
        ></div>
      </form>

      <p class="login-note">
        Sudah punya akun?
        <a href="./login.html">Masuk</a>
      </p>
    </section>

    <footer class="footnote">
      MEXA SMART · Registrasi akun<br>
      Keamanan akun dan kata sandi ditangani melalui
      sistem autentikasi resmi.
    </footer>
  </main>

  <script>
  (function (window, document) {
    "use strict";

    const form = document.getElementById("mexaRegisterForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("registerMessage");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message visible " + type;
    }

    /*
     * KONTRAK RESMI UNTUK PENGHUBUNG 1:
     * MEXA_CONNECTOR_1.registerUser(payload)
     *
     * Penghubung 1 meneruskan pendaftaran ke System Pusat.
     * System Pusat menangani Supabase Auth.
     *
     * Kata sandi tidak disimpan di Registry dan
     * tidak dimasukkan ke profil/database biasa.
     */
    window.MEXA_HTML_REGISTRY = Object.freeze({
      version: "1.0.0",

      async registerUser(payload) {
        const connector = window.MEXA_CONNECTOR_1;

        if (
          !connector ||
          typeof connector.registerUser !== "function"
        ) {
          throw new Error(
            "Jalur pendaftaran belum tersambung. " +
            "Penghubung 1 dan System Pusat harus disamakan " +
            "dengan kontrak registerUser(payload) terlebih dahulu."
          );
        }

        return connector.registerUser(payload);
      }
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const displayName =
        document.getElementById("displayName").value.trim();

      const username =
        document.getElementById("username").value.trim().toLowerCase();

      const email =
        document.getElementById("email").value.trim().toLowerCase();

      const password =
        document.getElementById("password").value;

      const confirmation =
        document.getElementById("confirmPassword").value;

      if (password !== confirmation) {
        showMessage(
          "Kata sandi dan konfirmasinya tidak sama.",
          "error"
        );
        return;
      }

      if (!/^[a-z0-9_.]{3,30}$/.test(username)) {
        showMessage(
          "Username harus 3–30 karakter: huruf, angka, titik, atau garis bawah.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Mengirim pendaftaran...";
      showMessage(
        "Menghubungkan formulir dengan jalur pendaftaran MEXA...",
        "info"
      );

      try {
        const result = await window.MEXA_HTML_REGISTRY.registerUser({
          displayName,
          username,
          email,
          password
        });

        if (!result || result.accepted !== true) {
          throw new Error(
            "System Pusat belum mengonfirmasi pendaftaran."
          );
        }

        /*
         * Jangan mempertahankan kata sandi di form
         * setelah pendaftaran berhasil.
         */
        form.reset();

        showMessage(
          result.message ||
          "Pendaftaran diterima. Ikuti petunjuk konfirmasi akun dari sistem.",
          "info"
        );
      } catch (error) {
        showMessage(
          String(error.message || error),
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Daftar Sekarang";
      }
    });

  })(window, document);
  </script>
</body>
</html>
