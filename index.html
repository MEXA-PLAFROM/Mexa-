<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Roblox</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #1a1a2e;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: white;
        touch-action: none;
    }
    #ui {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        background: rgba(0,0,0,0.6);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        font-size: 15px;
    }
    #controls {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        z-index: 10;
        flex-wrap: wrap;
        padding: 0 10px;
    }
    button {
        background: #4f46e5;
        border: none;
        color: white;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 0 #312e81;
    }
    button:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #312e81;
    }
    #mode-btn {
        background: #059669;
        box-shadow: 0 4px 0 #047857;
    }
    canvas {
        display: block;
        background: #87CEEB;
    }
    #info {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.7);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 13px;
        z-index: 10;
        text-align: center;
    }
</style>
</head>
<body>
<div id="ui">
    <div>🧱 Block: <span id="block-count">0</span></div>
    <div>💰 Coin: <span id="coin-count">0</span></div>
    <div id="mode-text">Mode: Jalan</div>
</div>

<canvas id="game"></canvas>

<div id="info">
    WASD / Panah = Gerak | Klik = Pasang/Hapus Block | Spasi = Ganti Mode
</div>

<div id="controls">
    <button onclick="setMode('walk')">🚶 Jalan</button>
    <button id="mode-btn" onclick="setMode('build')">🧱 Build</button>
    <button onclick="setMode('remove')">🗑️ Hapus</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game settings
const TILE = 40;
const MAP_W = 40;
const MAP_H = 30;

// World
let map = [];
for (let y = 0; y < MAP_H; y++) {
    map[y] = [];
    for (let x = 0; x < MAP_W; x++) {
        // Ground
        if (y > MAP_H - 8) map[y][x] = 1; // tanah
        else map[y][x] = 0; // udara
    }
}

// Tambah beberapa block awal biar menarik
for (let i = 0; i < 60; i++) {
    const x = Math.floor(Math.random() * MAP_W);
    const y = Math.floor(Math.random() * (MAP_H - 10)) + 5;
    if (map[y][x] === 0) map[y][x] = Math.random() > 0.7 ? 2 : 3;
}

// Coins
let coins = [];
for (let i = 0; i < 25; i++) {
    coins.push({
        x: Math.floor(Math.random() * MAP_W),
        y: Math.floor(Math.random() * (MAP_H - 10)) + 3
    });
}

// Player
const player = {
    x: 10,
    y: 10,
    w: 28,
    h: 28,
    speed: 3.2,
    color: '#ef4444'
};

let keys = {};
let mode = 'walk'; // walk, build, remove
let blockCount = 0;
let coinCount = 0;
let cameraX = 0;
let cameraY = 0;

// Warna block
const colors = {
    0: null,
    1: '#4ade80',   // rumput/tanah
    2: '#a3a3a3',   // batu
    3: '#f59e0b',   // kayu
    4: '#3b82f6',   // air (tidak dipakai)
    5: '#ec4899'    // block spesial
};

// Input
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ') {
        e.preventDefault();
        cycleMode();
    }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener('click', e => {
    if (mode === 'walk') return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left + cameraX;
    const my = e.clientY - rect.top + cameraY;

    const tx = Math.floor(mx / TILE);
    const ty = Math.floor(my / TILE);

    if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return;

    if (mode === 'build' && map[ty][tx] === 0) {
        map[ty][tx] = 2; // default batu
        blockCount++;
        updateUI();
    }
    if (mode === 'remove' && map[ty][tx] !== 0 && map[ty][tx] !== 1) {
        map[ty][tx] = 0;
        blockCount = Math.max(0, blockCount - 1);
        updateUI();
    }
});

// Touch support sederhana
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = touch.clientX - rect.left + cameraX;
    const my = touch.clientY - rect.top + cameraY;
    const tx = Math.floor(mx / TILE);
    const ty = Math.floor(my / TILE);

    if (mode === 'build' && map[ty] && map[ty][tx] === 0) {
        map[ty][tx] = 2;
        blockCount++;
        updateUI();
    } else if (mode === 'remove' && map[ty] && map[ty][tx] > 1) {
        map[ty][tx] = 0;
        blockCount = Math.max(0, blockCount - 1);
        updateUI();
    }
}, {passive: false});

function setMode(m) {
    mode = m;
    document.getElementById('mode-text').textContent = 
        mode === 'walk' ? 'Mode: Jalan' : 
        mode === 'build' ? 'Mode: Build (Klik untuk pasang)' : 
        'Mode: Hapus (Klik untuk hapus)';
}

function cycleMode() {
    if (mode === 'walk') setMode('build');
    else if (mode === 'build') setMode('remove');
    else setMode('walk');
}

function updateUI() {
    document.getElementById('block-count').textContent = blockCount;
    document.getElementById('coin-count').textContent = coinCount;
}

function update() {
    // Gerakan
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy = -player.speed;
    if (keys['s'] || keys['arrowdown']) dy = player.speed;
    if (keys['a'] || keys['arrowleft']) dx = -player.speed;
    if (keys['d'] || keys['arrowright']) dx = player.speed;

    // Coba gerak X
    player.x += dx;
    if (collides()) player.x -= dx;

    // Coba gerak Y
    player.y += dy;
    if (collides()) player.y -= dy;

    // Batas map
    player.x = Math.max(0, Math.min(player.x, MAP_W * TILE - player.w));
    player.y = Math.max(0, Math.min(player.y, MAP_H * TILE - player.h));

    // Camera follow
    cameraX = player.x - canvas.width / 2 + player.w / 2;
    cameraY = player.y - canvas.height / 2 + player.h / 2;
    cameraX = Math.max(0, Math.min(cameraX, MAP_W * TILE - canvas.width));
    cameraY = Math.max(0, Math.min(cameraY, MAP_H * TILE - canvas.height));

    // Ambil coin
    for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        const cx = c.x * TILE + TILE / 2;
        const cy = c.y * TILE + TILE / 2;
        if (Math.abs(player.x + player.w/2 - cx) < 25 && Math.abs(player.y + player.h/2 - cy) < 25) {
            coins.splice(i, 1);
            coinCount++;
            updateUI();
        }
    }
}

function collides() {
    const corners = [
        {x: player.x + 4, y: player.y + 4},
        {x: player.x + player.w - 4, y: player.y + 4},
        {x: player.x + 4, y: player.y + player.h - 4},
        {x: player.x + player.w - 4, y: player.y + player.h - 4}
    ];
    for (const p of corners) {
        const tx = Math.floor(p.x / TILE);
        const ty = Math.floor(p.y / TILE);
        if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
        if (map[ty][tx] > 0) return true;
    }
    return false;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Langit
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Gambar map
    const startX = Math.floor(cameraX / TILE);
    const startY = Math.floor(cameraY / TILE);
    const endX = startX + Math.ceil(canvas.width / TILE) + 1;
    const endY = startY + Math.ceil(canvas.height / TILE) + 1;

    for (let y = startY; y < endY; y++) {
        for (let x = startX; x < endX; x++) {
            if (y < 0 || x < 0 || y >= MAP_H || x >= MAP_W) continue;
            const tile = map[y][x];
            if (tile === 0) continue;

            const px = x * TILE - cameraX;
            const py = y * TILE - cameraY;

            ctx.fillStyle = colors[tile] || '#888';
            ctx.fillRect(px, py, TILE, TILE);

            // Border biar keliatan blocky
            ctx.strokeStyle = 'rgba(0,0,0,0.2)';
            ctx.strokeRect(px, py, TILE, TILE);
        }
    }

    // Coins
    coins.forEach(c => {
        const px = c.x * TILE - cameraX + TILE/2;
        const py = c.y * TILE - cameraY + TILE/2;
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#facc15';
        ctx.fill();
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 2;
        ctx.stroke();
    });

    // Player
    const px = player.x - cameraX;
    const py = player.y - cameraY;

    // Badan
    ctx.fillStyle = player.color;
    ctx.fillRect(px, py, player.w, player.h);

    // Kepala
    ctx.fillStyle = '#fca5a5';
    ctx.fillRect(px + 4, py - 12, 20, 14);

    // Mata
    ctx.fillStyle = 'white';
    ctx.fillRect(px + 7, py - 8, 5, 5);
    ctx.fillRect(px + 16, py - 8, 5, 5);
    ctx.fillStyle = 'black';
    ctx.fillRect(px + 9, py - 6, 2, 2);
    ctx.fillRect(px + 18, py - 6, 2, 2);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

updateUI();
setMode('walk');
loop();
</script>
</body>
</html>
